name: guvenlik

# Depoya parola, bağlantı bilgisi, anahtar vb. gizli bilgi girmediğini denetler (gitleaks, ücretsiz; özel depoda çalışır).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gizli-bilgi:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al (tüm geçmiş)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks indir
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
          ./gitleaks version

      - name: Gizli bilgi taraması
        run: |
          ./gitleaks detect --source . --no-banner --redact --verbose --report-format json --report-path gl.json || {
            echo "::error::Depoda gizli bilgi olabilecek satır bulundu (içerik gizlendi):"
            python3 -c "import json;[print('::error file=%s,line=%s::%s'%(x['File'],x['StartLine'],x['RuleID'])) for x in json.load(open('gl.json'))[:15]]"
            exit 1
          }
