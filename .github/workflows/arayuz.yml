name: arayuz

# Arayüz denetimleri (Dilim 31): köprü komut/alan tutarlılığı, ESLint, Playwright duman testi (her rol × her sekme × düğmeler).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Komut/alan denetiminin kendi testleri
        run: python3 -I tools/test_arayuz_denetim.py
      - name: Arayüz ↔ köprü ↔ belge tutarlılığı
        run: python3 -I tools/arayuz_denetim.py
      - name: ESLint kurulumu
        run: npm ci --prefix tools/lint
      - name: Arayüz betiği lint (taban dışı bulgu = hata)
        run: python3 tools/arayuz_lint.py

  duman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright kurulumu
        run: |
          pip install playwright==1.63.0
          playwright install --with-deps chromium
      - name: Duman testi (sahte köprü; rol × sekme × düğme)
        run: python3 tests/ui/ui_duman.py
