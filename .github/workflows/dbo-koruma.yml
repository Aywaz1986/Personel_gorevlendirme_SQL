name: dbo-koruma

# KESİN KURAL: gorev betikleri dbo.* nesnelerine dokunmaz (yazma, DDL, GRANT yok; okuma yalnızca izinli dosyada).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Denetimin kendi testleri
        run: python3 -I tools/test_dbo_koruma.py
      - name: gorev betiklerini tara
        run: python3 -I tools/dbo_koruma.py
